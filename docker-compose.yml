services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  falkordb:
    image: falkordb/falkordb-server:v4.14.9
    ports:
      - "16380:6379"
    volumes:
      - falkordb_data:/data

volumes:
  qdrant_data:
  falkordb_data:
